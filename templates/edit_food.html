<!DOCTYPE html>
<html>
<head>
    <title>Edit Item</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="form-box">
    <h2>Edit Food Item</h2>

    <form method="POST">

        <input type="text"
               name="name"
               value="{{ food.name }}"
               required>

        <select name="category" required>
            <option value="Food" {% if food.category == 'Food' %}selected{% endif %}>
                Food
            </option>

            <option value="Drinks" {% if food.category == 'Drinks' %}selected{% endif %}>
                Drinks
            </option>
        </select>

        <input type="number"
               step="0.01"
               name="price"
               value="{{ food.price }}"
               required>

        <textarea name="description" required>{{ food.description }}</textarea>

        <button type="submit">
            Update Item
        </button>

    </form>
</div>

</body>
</html>
